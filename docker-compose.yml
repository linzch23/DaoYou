services:
  postgres:
    image: postgres:16
    container_name: daoyou-postgres
    environment:
      POSTGRES_DB: daoyou
      POSTGRES_USER: daoyou
      POSTGRES_PASSWORD: daoyou
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daoyou -d daoyou"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: daoyou-backend
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://daoyou:daoyou@postgres:5432/daoyou
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    command: >
      sh -c "uv run --no-sync alembic upgrade head &&
             uv run --no-sync python -m app.db.seed &&
             uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
