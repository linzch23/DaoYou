# PageStatus.yaml — runtime state of the page-level state machine
#
# 目的:作为「前端自运行迭代小组」的运行时真相,被 7 个 rein 共同读写。
#
# 关键规则(完整定义见 workflow/AGENT_CONTRACTS.md):
#   * 每个页面拥有独立的 Page 块
#   * 谁负责改哪个字段,见 AGENT_CONTRACTS.md 的「文件归属矩阵」
#   * 状态迁移必须遵循 AGENT_CONTRACTS.md 的「合法状态迁移表」
#   * FinalStatus = Done 必须同时满足:
#       Architecture: Pass
#       Development:  Completed
#       Review: { ui: Pass, spec: Pass, test: Pass }
#
# 注意:这个 YAML 文件由人类或 Orchestrator 创建初始 Page 块,
#       后续由对应 rein 在每次退出前改写自己的字段。
#       Orchestrator 自身**不修改**此文件。

