# PageStatus.yaml — runtime state of the page-level state machine
#
# 目的:作为「前端自运行迭代小组」的运行时真相,被 7 个 rein 共同读写。
#
# 关键规则(完整定义见 workflow/AGENT_CONTRACTS.md):
#   * 每个页面拥有独立的 Page 块
#   * 谁负责改哪个字段,见 AGENT_CONTRACTS.md 的「文件归属矩阵」
#   * 状态迁移必须遵循 AGENT_CONTRACTS.md 的「合法状态迁移表」
#   * FinalStatus = Done 必须同时满足:
#       Architecture: Pass
#       Development:  Completed
#       Review: { ui: Pass, spec: Pass, test: Pass }
#
# 注意:这个 YAML 文件由人类或 Orchestrator 创建初始 Page 块,
#       后续由对应 rein 在每次退出前改写自己的字段。
#       Orchestrator 自身**不修改**此文件。

# ============================================================
# Page: LoginPage  ──  示例页面,展示一个完整的状态机形状
# ============================================================
- Page: LoginPage

  Spec:
    status: NotStarted          # NotStarted → Completed (由 spec-writer 改写)
    # 备注:Architecture.status 也会被 spec-writer 在「修订后」重置为 NotStarted
    #       (见 architecture-reviewer.退出 与 spec-writer.退出)

  Architecture:
    status: NotStarted          # NotStarted → Pass / Fail (由 architecture-reviewer 改写)

  Development:
    status: NotStarted          # NotStarted → Completed (由 code-writer 在「新开发」路径改写)

  Review:
    ui:   Pending               # Pending → Pass / Fail (由 ui-reviewer 改写)
    spec: Pending               # Pending → Pass / Fail (由 spec-auditor 改写)
    test: Pending               # Pending → Pass / Fail (由 test-agent 改写)

  FinalStatus: NotStarted       # NotStarted / InProgress / ReadyForReview / NeedReview / NeedFix / Done
                                # NotStarted        - 初始
                                # InProgress        - Orchestrator 已派发,中间态
                                # ReadyForReview    - code-writer 完成新开发,等待 3 个 reviewer 并行
                                # NeedReview        - code-writer 修完 Issue,等待 3 个 reviewer 重审
                                # NeedFix           - 任意 reviewer Fail,等待 code-writer 修
                                # Done              - 三审全过 + 架构 Pass + 开发 Completed
