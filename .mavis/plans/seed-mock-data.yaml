version: 1
plan:
  name: '扩展 seed.py,补全 mock 现有 trip 数据到 db'
  max_concurrency: 1
  max_consecutive_failures: 2
  max_cycles: 6
  auto_reject_retries: 1
  verifier_config:
    default_verifiers: [verifier]
    audit_sample_rate: 0.0
tasks:
  - id: 'seed-mock-data'
    title: '扩展 backend seed.py,补全 mock 现有 trip 数据'
    prompt: |
      ## 任务背景

      上一轮 `disable-mock-default` 已经把前端 mock 拦截器关掉(`USE_MOCK_FALLBACK=false`),后端真链路全程打开。
      但 db 里演示数据比较薄,前端 13 个 page demo 不到完整场景。

      **用户最新指示**(2026-06-18):
      > 只需要保证现有的 mock 相关的数据能够在 db 中存在即可,
      > chat_messages / notifications / photo_records / user_memory 可以为空。

      翻译:把前端 mock(`frontend/api/mock/_seed.ts`)里**已有的、静态的、跟前端 demo 强相关**的数据,灌进 db。
      4 张动态表(chat / notifications / photo_records / user_memory)用户明确说**不动**。

      ## db 现状 vs mock 现状

      | 表 | mock(_seed.ts) | db(现在) | 差 |
      |---|---|---|---|
      | users | 1 | 1 | ✅ 已有 |
      | user_preferences | 1 | 1 | ✅ 已有 |
      | trips | 5 (大连/青岛/西安/西藏/上海) | 1 (大连) | 差 4 |
      | trip_days | 4 (trip1×3 + trip2×1) | 3 (trip1×3) | 差 1 |
      | trip_items | 8 (trip1×8) | 5 (trip1×5) | 差 3 |
      | chat_messages | 6 | 0 | **不动** |
      | notifications | 2 | 0 | **不动** |
      | photo_records | 0 | 0 | 不动 |
      | user_memory | 2 | 0 | **不动** |

      ## 你的具体工作

      ### 1. 改 `backend/app/db/seed.py`

      把当前 `build_demo_seed()` + `seed_database()` 扩展成支持**多 trip** + 幂等。

      **trip 1 补 3 item**(大连三日游,让 trip 1 有 8 item 跟 mock 一致):
      - trip 1 day 1 现有 item 5(渔人码头/老虎滩/大连博物馆/星海广场/东港)
        — 注意:这 5 item 的具体标题/坐标可能跟 mock 不完全一样,**不需要改**,保留后端 seed.py 现状
        — 你只需要**新增** 3 item 让总数到 8
      - 缺的 3 item 来源:看 `frontend/api/mock/_seed.ts` L31-138 的 8 个 mock item,挑 3 个后端没有的 item
        (建议:午餐日式拉面 / 滨海路骑行 / 返程休整,字段值 1:1 抄 mock 经纬度+时间+notes)
        — 加到 trip 1 day 1 / day 3 都行,自己分配

      **新增 trip 2**(青岛两日周末,草稿):
      - 抄 `frontend/api/mock/_seed.ts:185-204` 的 `seedTrip2`,`status: 'draft'`,`deleted_at: null`
      - 1 个 day(trip_date 跟 mock 一致,summary: '栈桥 + 八大关')
      - 0 item

      **新增 trip 3**(西安四日文化行,已结束):
      - 抄 `_seed.ts:207-217` 的 `seedTrip3`,`status: 'finished'`,`deleted_at: null`
      - 0 day,0 item

      **新增 trip 4 / 5**(回收站,演示 TrashPage):
      - 抄 `_seed.ts:222-243` 的 `seedTrip4` (西藏自驾游) 和 `seedTrip5` (上海周末)
      - `status: 'finished'`,`deleted_at: '<ISO timestamp>'` **必须有值**(非 null),演示 TrashPage 的 loaded 视图态
      - 0 day,0 item

      ### 2. 幂等性

      第二次跑 seed_database() 必须 0 副作用:
      - 已存在的 trip(`user_id + title` 联合唯一):跳过
      - 已存在的 day(`trip_id + day_index` 联合唯一):跳过
      - 已存在的 item(`trip_day_id + title` 联合唯一):跳过
      - 已存在的 user:`session.get(User, id)` 检查;已存在就 update 而不是 insert(避免 `created_user` 标志位)

      实现方式推荐:把当前 `seed_database()` 的"trip 已存在就 return"那个 early return **删掉**,
      改成"按 title 逐个 select,不存在才 add"。这样多次跑是 upsert 语义。

      ### 3. 跑一次 seed + 验

      **必须执行**:
      ```bash
      cd /Users/andrew/Desktop/Vivo/DaoYou
      docker compose exec -T backend python -m app.db.seed
      ```
      看输出 `result` 字典,记录 `created_user / trip_id / trip_days / trip_items` 数字。

      **然后 psql 验**:
      ```bash
      docker compose exec -T postgres psql -U daoyou -d daoyou -c \
        "SELECT 'trips' as t, count(*) FROM trips
         UNION ALL SELECT 'trip_days', count(*) FROM trip_days
         UNION ALL SELECT 'trip_items', count(*) FROM trip_items;"
      ```
      预期:trips=5, trip_days=4, trip_items=8。

      **然后 psql 看 trip 4/5 的 deleted_at**:
      ```bash
      docker compose exec -T postgres psql -U daoyou -d daoyou -c \
        "SELECT id, title, status, deleted_at FROM trips WHERE deleted_at IS NOT NULL;"
      ```
      预期:2 行(trip 4 西藏 + trip 5 上海),`deleted_at` 字段非空。

      **然后 curl 验真后端 API**:
      ```bash
      curl -sS http://localhost:8000/api/trips | python3 -m json.tool
      ```
      预期:返回 5 个 trip 的 list,字段 `id / title / city / start_date / end_date / status / deleted_at` 全有。

      **再跑一次 seed 验幂等**:
      ```bash
      docker compose exec -T backend python -m app.db.seed
      ```
      预期:再次执行不报错,行数不变(trips=5, trip_days=4, trip_items=8)。

      ### 4. 边界注意

      - **不要碰 4 张动态表**:chat_messages / notifications / photo_records / user_memory 保持 0 行
      - **不要修改 frontend/** 任何文件(seed 改动纯 backend 域)
      - **不要改 user_preferences**:用户已说 preferences 已有(1 行),保留
      - **不要改 trip 1 的现有 5 item**:保留,只**新增** 3 个让总数到 8
      - **不要改 `frontend/api/mock/_seed.ts`**:前端 mock 是 reference,不是 source of truth for db
      - **不要在 deliverable 里建议改 4 张动态表**:用户明确说保持空,任何"是否要加 chat 历史"的建议都是越权

      ### 5. 写 deliverable

      路径:`/Users/andrew/Desktop/Vivo/DaoYou/.mavis/plans/seed-mock-data/outputs/seed-mock-data/deliverable.md`

      5 章节,中文:
      1. **背景**(1 段):用户指示 + db 现状
      2. **改了什么**(diff 摘要):seed.py 改动的核心逻辑,贴关键代码块
      3. **验收**(实证):4 个命令的输出原文 + 截图/数字
      4. **幂等性证据**:再跑一次 seed 的输出 + 行数不变证据
      5. **没改的**(明确列出):4 张动态表不动 / frontend 0 改动 / user_preferences 保留 / 现有 trip 1 的 5 item 保留

    assigned_to: 'coder'
    verified_by: 'verifier'
    verify_prompt: |
      ## 独立验证 seed.py 扩展是否生效

      你是 verifier,**不要重读** producer 的 deliverable,直接跑命令验。

      ### 1. 跑 seed 验幂等(双次跑)

      ```bash
      cd /Users/andrew/Desktop/Vivo/DaoYou
      docker compose exec -T backend python -m app.db.seed
      docker compose exec -T backend python -m app.db.seed  # 第二次,验幂等
      ```
      预期:两次都返回 0 error,行数不变。

      ### 2. psql 行数硬验

      ```bash
      docker compose exec -T postgres psql -U daoyou -d daoyou -c \
        "SELECT 'users' as t, count(*) FROM users
         UNION ALL SELECT 'user_preferences', count(*) FROM user_preferences
         UNION ALL SELECT 'trips', count(*) FROM trips
         UNION ALL SELECT 'trip_days', count(*) FROM trip_days
         UNION ALL SELECT 'trip_items', count(*) FROM trip_items
         UNION ALL SELECT 'chat_messages', count(*) FROM chat_messages
         UNION ALL SELECT 'notifications', count(*) FROM notifications
         UNION ALL SELECT 'photo_records', count(*) FROM photo_records
         UNION ALL SELECT 'user_memory', count(*) FROM user_memory;"
      ```

      预期数字(硬要求,任何一项 FAIL 即整个 plan FAIL):
      - users = 1
      - user_preferences = 1
      - trips = **5**
      - trip_days = **4**
      - trip_items = **8**
      - chat_messages = 0(用户明确说不动)
      - notifications = 0(用户明确说不动)
      - photo_records = 0
      - user_memory = 0(用户明确说不动)

      ### 3. psql 验 deleted_at 字段

      ```bash
      docker compose exec -T postgres psql -U daoyou -d daoyou -c \
        "SELECT id, title, status, deleted_at IS NOT NULL as has_deleted_at
         FROM trips ORDER BY id;"
      ```
      预期:5 行,trip 1/2/3 `has_deleted_at=f`,trip 4/5 `has_deleted_at=t`。
      **关键**:TrashPage 演示依赖 trip 4/5 的 `deleted_at` 非空。

      ### 4. curl 验真后端 API

      ```bash
      curl -sS http://localhost:8000/api/trips | python3 -m json.tool | head -80
      ```
      预期:返回 5 个 trip,字段完整,无 500 error。

      ```bash
      curl -sS http://localhost:8000/api/trips/1 | python3 -m json.tool | head -60
      ```
      预期:trip 1 详情有 3 days × 8 items 总数对得上。

      ### 5. 边界不破

      ```bash
      cd /Users/andrew/Desktop/Vivo/DaoYou
      git status --short backend/app/db/seed.py
      ```
      预期:seed.py 有改动(不是空 commit)。

      ```bash
      git status --short frontend/
      ```
      预期:**0 改动**。frontend 0 改动是硬要求。

      ### 6. PASS / FAIL 标准

      **PASS**:所有 5 步命令通过,9 张表行数精确匹配(尤其 trips=5, trip_days=4, trip_items=8, 4 张动态表全 0),
      trip 4/5 deleted_at 非空,curl API 返回 200 + 5 trips。

      **FAIL**:任何一项不匹配,deliverable 里**没解释**为什么数字不对,或 frontend/ 有意外改动。
      FAIL 时用一句话说明:「第 N 步 X 命令预期 Y,实际 Z」。

    max_retries: 2
